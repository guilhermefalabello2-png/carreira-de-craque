name: Deploy Carreira de Craque

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          mkdir public
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          INDEX=$(find extracted -iname "index.html" -type f | head -n 1)
          test -n "$INDEX"
          cp -a "$(dirname "$INDEX")"/. public/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
