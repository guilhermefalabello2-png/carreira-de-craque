name: Criar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  criar-apk:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extrair jogo
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          INDEX=$(find extracted -name index.html -type f | head -n 1)
          test -n "$INDEX"
          mkdir www
          cp -a "$(dirname "$INDEX")"/. www/

      - name: Criar projeto Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "Carreira de Craque" com.guilherme.carreiradecraque --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carreira-de-Craque-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
